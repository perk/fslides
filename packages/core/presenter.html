<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0c0e13; color: #e8eaef;
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header {
    flex-shrink: 0; display: flex; align-items: baseline; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  #timer {
    font-variant-numeric: tabular-nums; font-size: 1.6rem; font-weight: 700;
    letter-spacing: 0.04em; cursor: pointer; color: #fff;
  }
  #timer.running { color: #FF6A1A; }
  #count { color: rgba(255,255,255,0.5); font-size: 0.92rem; }
  #label {
    font-family: Inter, -apple-system, sans-serif;
    font-size: 1rem; font-weight: 650; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hint { margin-left: auto; color: rgba(255,255,255,0.4); font-size: 0.92rem; white-space: nowrap; }
  .note-size {
    display: inline-flex; gap: 6px; margin-left: 8px;
  }
  .note-size button {
    background: transparent; color: rgba(255,255,255,0.75);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 6px;
    padding: 2px 8px; cursor: pointer;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 0.92rem; letter-spacing: 0;
  }
  .note-size button:hover { background: rgba(255,255,255,0.06); }
  #waiting {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.5); font-size: 1.15rem; padding: 24px; text-align: center;
  }
  #deck {
    flex: 1; min-height: 0; display: none;
    grid-template-columns: minmax(220px, var(--split, 50%)) 14px minmax(200px, 1fr);
    grid-template-rows: 1fr 1fr;
    gap: 12px 0; padding: 12px 16px;
  }
  .card { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  .card.now { grid-column: 1; grid-row: 1; }
  .card.next { grid-column: 1; grid-row: 2; }
  #split {
    grid-column: 2; grid-row: 1 / span 2; cursor: col-resize; position: relative;
    touch-action: none; margin: -12px 0;
  }
  #split::before {
    content: ''; position: absolute; top: 12px; bottom: 12px; left: 6px;
    width: 2px; border-radius: 1px; background: rgba(255,255,255,0.14);
  }
  #split:hover::before, #split.dragging::before { background: #FF6A1A; }
  .card h2 {
    flex-shrink: 0; margin: 0 0 6px; font-size: 0.92rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .card.now h2 { color: #FF6A1A; }
  .viewport { position: relative; flex: 1; min-height: 0; background: #000; border-radius: 8px; overflow: hidden; }
  .viewport.next { cursor: pointer; }
  .viewport iframe {
    position: absolute; left: 50%; top: 50%;
    width: 1280px; height: 720px; margin-left: -640px; margin-top: -360px;
    border: 0; transform-origin: center center;
    pointer-events: none; background: #000;
  }
  .end {
    display: none; position: absolute; inset: 0;
    align-items: center; justify-content: center;
    color: rgba(255,255,255,0.5); font-size: 1rem;
  }
  .notes-wrap {
    grid-column: 3; grid-row: 1 / span 2; min-width: 0; min-height: 0;
    background: #141820; border-radius: 10px; overflow: hidden;
  }
  #notes {
    height: 100%; overflow: auto; padding: 18px 20px;
    white-space: pre-wrap; line-height: 1.45; font-size: 32px;
  }
  #notes.empty { color: rgba(255,255,255,0.4); font-style: italic; }
</style>
</head>
<body>
  <header>
    <div id="timer" title="Start or pause the talk timer">00:00</div>
    <div id="count"></div>
    <div id="label"></div>
    <div class="hint">audience sees the other window · ← → here moves both</div>
    <div class="note-size">
      <button id="smaller" type="button" title="Smaller notes">A−</button>
      <button id="larger" type="button" title="Larger notes">A+</button>
    </div>
  </header>
  <div id="waiting">Waiting for the slide window. Leave that window open, then press P there.</div>
  <div id="deck">
    <section class="card now">
      <h2>Now</h2>
      <div class="viewport" id="now-view"><iframe id="now" title="Current slide"></iframe></div>
    </section>
    <section class="card next">
      <h2>Next</h2>
      <div class="viewport next" id="next-view" title="Next slide — click or press →">
        <iframe id="next" title="Next slide"></iframe>
        <div class="end" id="end">End of the deck</div>
      </div>
    </section>
    <div id="split" title="Drag to resize" role="separator" aria-orientation="vertical" aria-label="Resize notes"></div>
    <section class="notes-wrap">
      <div id="notes"></div>
    </section>
  </div>
<script>
const channel = new BroadcastChannel('fuckslides-presenter');
const waitingEl = document.getElementById('waiting');
const deckEl = document.getElementById('deck');
const nowView = document.getElementById('now-view');
const nextView = document.getElementById('next-view');
const nowFrame = document.getElementById('now');
const nextFrame = document.getElementById('next');
const endEl = document.getElementById('end');
const notesEl = document.getElementById('notes');
const timerEl = document.getElementById('timer');
const countEl = document.getElementById('count');
const labelEl = document.getElementById('label');

let notePx = Number(localStorage.getItem('fs-presenter-note-px')) || 32;
let timerRunning = false, timerBase = 0, timerAt = 0;
let connected = false;

function applyNoteSize() {
  notePx = Math.max(18, Math.min(72, notePx));
  notesEl.style.fontSize = notePx + 'px';
  localStorage.setItem('fs-presenter-note-px', String(notePx));
}
applyNoteSize();
document.getElementById('smaller').addEventListener('click', () => { notePx -= 4; applyNoteSize(); });
document.getElementById('larger').addEventListener('click', () => { notePx += 4; applyNoteSize(); });

function fit(viewport, iframe) {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (!w || !h) return;
  const scale = Math.min(w / 1280, h / 720);
  iframe.style.transform = 'scale(' + scale + ')';
}
function fitAll() { fit(nowView, nowFrame); fit(nextView, nextFrame); }
window.addEventListener('resize', fitAll);
if (typeof ResizeObserver !== 'undefined') {
  const fitObserver = new ResizeObserver(fitAll);
  fitObserver.observe(nowView);
  fitObserver.observe(nextView);
}

const splitEl = document.getElementById('split');
const SPLIT_KEY = 'fs-presenter-split';
let splitRatio = Number(localStorage.getItem(SPLIT_KEY));
if (!(splitRatio >= 0.22 && splitRatio <= 0.78)) splitRatio = 0.5;

function applySplit() {
  deckEl.style.setProperty('--split', (splitRatio * 100) + '%');
  requestAnimationFrame(fitAll);
}
applySplit();

splitEl.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  splitEl.classList.add('dragging');
  const move = (ev) => {
    const rect = deckEl.getBoundingClientRect();
    if (!rect.width) return;
    splitRatio = Math.max(0.22, Math.min(0.78, (ev.clientX - rect.left) / rect.width));
    applySplit();
  };
  const up = () => {
    splitEl.classList.remove('dragging');
    localStorage.setItem(SPLIT_KEY, String(splitRatio));
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});

function slideSrc(file, density) {
  if (!file) return '';
  if (density == null) return file;
  return file + (file.includes('?') ? '&' : '?') + 'density=' + density;
}
function setFrame(iframe, file, density) {
  const next = slideSrc(file, density);
  if (iframe.dataset.src === next) return;
  iframe.dataset.src = next;
  iframe.style.display = file ? 'block' : 'none';
  if (file) iframe.src = next;
  else iframe.removeAttribute('src');
}

function step(slides, disabled, idx, dir) {
  const off = new Set(disabled || []);
  let i = idx + dir;
  while (i >= 0 && i < slides.length && off.has(slides[i])) i += dir;
  return (i >= 0 && i < slides.length) ? i : -1;
}

function fmt(ms) {
  ms = Math.max(0, ms);
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function shownMs() {
  return timerRunning ? timerBase + (Date.now() - timerAt) : timerBase;
}
setInterval(() => { timerEl.textContent = fmt(shownMs()); }, 250);

function send(action) { channel.postMessage({ type: 'command', action }); }

channel.onmessage = (ev) => {
  const msg = ev.data;
  if (!msg || msg.type !== 'state' || !Array.isArray(msg.slides)) return;
  connected = true;
  waitingEl.style.display = 'none';
  deckEl.style.display = 'grid';

  const slides = msg.slides;
  const disabled = msg.disabled || [];
  const idx = Math.max(0, Math.min(slides.length - 1, msg.idx || 0));
  const labels = msg.labels || [];
  const off = new Set(disabled);
  const active = slides.filter(s => !off.has(s));
  const activeIdx = active.indexOf(slides[idx]);
  countEl.textContent = (activeIdx + 1) + ' / ' + active.length;
  labelEl.textContent = labels[idx] || slides[idx] || '';

  const density = (typeof msg.density === 'number') ? msg.density : null;
  setFrame(nowFrame, slides[idx], density);
  const n = step(slides, disabled, idx, 1);
  if (n === -1) {
    setFrame(nextFrame, '', density);
    endEl.style.display = 'flex';
  } else {
    endEl.style.display = 'none';
    setFrame(nextFrame, slides[n], density);
  }
  requestAnimationFrame(fitAll);

  const note = ((msg.notes && msg.notes[slides[idx]]) || '').trim();
  notesEl.textContent = note || 'No speaker notes for this slide.';
  notesEl.classList.toggle('empty', !note);
  notesEl.scrollTop = 0;

  timerRunning = !!msg.timerRunning;
  timerBase = msg.timerMs || 0;
  timerAt = Date.now();
  timerEl.classList.toggle('running', timerRunning);
  timerEl.textContent = fmt(shownMs());
};

nextView.addEventListener('click', () => send('next'));
timerEl.addEventListener('click', () => send('timer-toggle'));

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.tagName === 'SELECT')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
    e.preventDefault(); send('next');
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault(); send('prev');
  } else if (e.key === 'c' || e.key === 'C') {
    send('timer-toggle');
  } else if (e.key === 'r' || e.key === 'R') {
    send('timer-reset');
  } else if (e.key === '+' || e.key === '=') {
    notePx += 4; applyNoteSize();
  } else if (e.key === '-' || e.key === '_') {
    notePx -= 4; applyNoteSize();
  }
});

function hello() { channel.postMessage({ type: 'command', action: 'hello' }); }
hello();
setInterval(() => { if (!connected) hello(); }, 1000);
window.addEventListener('focus', hello);
</script>
</body>
</html>
